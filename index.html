<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Task Revival Pro</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#74ebd5,#9face6);
    font-family:'Segoe UI','PingFang TC','Helvetica Neue',sans-serif;
}
canvas{
    border-radius:20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.3);
}
#overlay{
    position:absolute;
    text-align:center;
    max-width:380px;
}
.panel{
    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(15px);
    padding:20px;
    border-radius:20px;
}
button{
    padding:8px 14px;
    margin:6px;
    border:none;
    border-radius:10px;
    font-size:14px;
    background:#667eea;
    color:white;
    cursor:pointer;
}
button.active{
    background:#ff6b6b;
}
.task-item{
    display:flex;
    align-items:center;
    gap:10px;
    margin:6px 0;
}
input[type="text"]{
    width:90%;
    padding:6px;
    border-radius:8px;
    border:none;
    margin:5px 0;
}
</style>
</head>

<body>

<div id="overlay"></div>
<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");

/* ✅ Leaderboard (Session) */
let leaderboard=[];
function saveScore(name,score,diff){
    leaderboard.push({name,score,diff});
    leaderboard.sort((a,b)=>b.score-a.score);
    leaderboard=leaderboard.slice(0,5);
}
function showLeaderboard(){
    let html="<div class='panel'><h2>🏆 Leaderboard</h2>";
    if(leaderboard.length===0){
        html+="<div>尚未有分數</div>";
    }else{
        leaderboard.forEach((p,i)=>{
            html+=`<div>${i+1}. ${p.name} - ${p.score} (${p.diff})</div>`;
        });
    }
    html+="<button onclick='showSetup()'>返回</button></div>";
    overlay.innerHTML=html;
}

/* ✅ 任務 */
let tasks=[];
let activeTasks=[];
let taskStatus=[];
let reviveMessage="完成 3 個任務即可復活！";
let reviveCount=0;
const maxRevives=5;

/* ✅ 難度 */
let difficulty="normal";

function difficultyButton(value,label){
    return `<button class="${difficulty===value?'active':''}"
        onclick="setDifficulty('${value}')">${label}</button>`;
}

function setDifficulty(level){
    difficulty=level;
    showSetup();
}

function showSetup(){
    overlay.innerHTML=`
    <div class="panel">
    <h2>建立任務清單</h2>
    <input type="text" id="taskInput" placeholder="請輸入目標字詞！！！"><br>
    <input type="text" id="reviveInput" placeholder="請輸入復活條件！！！"><br>

    <div>選擇難度：</div>
    ${difficultyButton("easy","Easy")}
    ${difficultyButton("normal","Normal")}
    ${difficultyButton("difficult","Difficult")}

    <div>目前難度： <b>${difficulty.toUpperCase()}</b></div>

    <button onclick="saveSetup()">開始遊戲</button>
    <button onclick="showLeaderboard()">查看排行榜</button>
    </div>`;
}

/* ✅ 飛行音效 */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function swoosh(startFreq,endFreq,duration,volume=0.2,type="triangle"){
    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type=type;
    osc.frequency.setValueAtTime(startFreq,audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(endFreq,audioCtx.currentTime+duration);
    gain.gain.setValueAtTime(volume,audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+duration);
    osc.start();
    osc.stop(audioCtx.currentTime+duration);
}
function jumpSound(){
    if(difficulty==="easy") swoosh(300,600,0.15,0.15);
    if(difficulty==="normal") swoosh(400,900,0.12,0.18);
    if(difficulty==="difficult") swoosh(600,1200,0.1,0.22);
}
function scoreSound(){
    if(difficulty==="easy") swoosh(500,800,0.18,0.12);
    if(difficulty==="normal") swoosh(700,1200,0.15,0.15);
    if(difficulty==="difficult") swoosh(900,1800,0.12,0.18);
}
function hitSound(){
    if(difficulty==="easy") swoosh(400,100,0.3,0.2,"sawtooth");
    if(difficulty==="normal") swoosh(500,80,0.35,0.25,"sawtooth");
    if(difficulty==="difficult") swoosh(700,60,0.4,0.3,"sawtooth");
}

/* ✅ 遊戲 */
let settings={speed:1.6,gap:220,spawnRate:140};
let bird={x:80,y:300,r:20,velocity:0,gravity:0.35,jump:-6};
let pipes=[];
let score=0;
let frames=0;
let gameStarted=false;
let gameOver=false;

function saveSetup(){
    let input=document.getElementById("taskInput").value;
    tasks=input.split(",").map(t=>t.trim()).filter(t=>t!="");

    if(tasks.length===0){
        tasks=["完成一項小任務","喝水","深呼吸"];
    }

    let msg=document.getElementById("reviveInput").value;
    if(msg) reviveMessage=msg;

    if(difficulty==="easy") settings.speed=1.2;
    if(difficulty==="normal") settings.speed=1.6;
    if(difficulty==="difficult") settings.speed=2.2;

    startGame();
}

function startGame(){
    overlay.innerHTML="";
    score=0;
    frames=0;
    pipes=[];
    bird.y=300;
    bird.velocity=0;
    reviveCount=0;
    gameStarted=true;
    gameOver=false;
}

function pickRandomTasks(){
    let shuffled=[...tasks];
    for(let i=shuffled.length-1;i>0;i--){
        let j=Math.floor(Math.random()*(i+1));
        [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]];
    }
    activeTasks=shuffled.slice(0,Math.min(3,shuffled.length));
    taskStatus=new Array(activeTasks.length).fill(false);
}

function gameOverScreen(){
    pickRandomTasks();
    let html="";
    activeTasks.forEach((t,i)=>{
        html+=`
        <div class="task-item">
            <input type="checkbox"
            onchange="updateTask(${i},this.checked)">
            <span>${t}</span>
        </div>`;
    });

    overlay.innerHTML=`
    <div class="panel">
        <h2>Game Over</h2>
        <div>分數：${score}</div>
        <input type="text" id="playerName" placeholder="輸入名字">
        <button onclick="submitScore()">提交分數</button>
        <div>${reviveMessage}</div>
        <div>剩餘復活次數：${maxRevives-reviveCount}</div>
        ${html}
        <div id="reviveArea"></div>
        <button onclick="showSetup()">重新開始</button>
    </div>`;
}

function submitScore(){
    let name=document.getElementById("playerName").value||"Player";
    saveScore(name,score,difficulty);
    showLeaderboard();
}

function updateTask(i,val){
    taskStatus[i]=val;
    if(taskStatus.filter(x=>x).length>=3 &&
       reviveCount<maxRevives){
        document.getElementById("reviveArea").innerHTML=
        `<button onclick="reviveBird()">🔥 復活小鳥</button>`;
    }
}

function reviveBird(){
    reviveCount++;
    gameOver=false;
    overlay.innerHTML="";
    bird.y=300;
    bird.velocity=0;
    pipes=[];
    frames=0;
}

document.addEventListener("click",()=>{
    if(gameStarted&&!gameOver){
        bird.velocity=bird.jump;
        jumpSound();
    }
});

function createPipe(){
    let topHeight=Math.random()*200+80;
    pipes.push({
        x:canvas.width,
        top:topHeight,
        bottom:canvas.height-topHeight-settings.gap-80,
        passed:false
    });
}

function update(){
    if(!gameStarted||gameOver)return;

    frames++;
    bird.velocity+=bird.gravity;
    bird.y+=bird.velocity;

    if(frames%settings.spawnRate===0)createPipe();

    pipes.forEach(pipe=>{
        pipe.x-=settings.speed;

        if(!pipe.passed&&pipe.x<bird.x){
            pipe.passed=true;
            score++;
            scoreSound();
        }

        if(
            bird.x+bird.r>pipe.x &&
            bird.x-bird.r<pipe.x+60 &&
            (bird.y-bird.r<pipe.top ||
             bird.y+bird.r>canvas.height-pipe.bottom-80)
        ){
            gameOver=true;
            hitSound();
            gameOverScreen();
        }
    });

    if(bird.y+bird.r>canvas.height-80){
        gameOver=true;
        hitSound();
        gameOverScreen();
    }
}

function drawBird(){
    ctx.save();
    ctx.translate(bird.x,bird.y);
    ctx.rotate(bird.velocity*0.05);
    ctx.fillStyle="#ffcc00";
    ctx.beginPath();
    ctx.arc(0,0,bird.r,0,Math.PI*2);
    ctx.fill();
    let wing=Math.sin(frames*0.3)*10;
    ctx.fillStyle="#ffaa00";
    ctx.beginPath();
    ctx.ellipse(-5,0,15,10,wing*Math.PI/180,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="white";
    ctx.beginPath();
    ctx.arc(8,-5,6,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="black";
    ctx.beginPath();
    ctx.arc(10,-5,3,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="orange";
    ctx.beginPath();
    ctx.moveTo(20,0);
    ctx.lineTo(35,5);
    ctx.lineTo(20,10);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function draw(){
    ctx.clearRect(0,0,400,600);
    pipes.forEach(pipe=>{
        ctx.fillStyle="#3cb043";
        ctx.fillRect(pipe.x,0,60,pipe.top);
        ctx.fillRect(pipe.x,600-pipe.bottom-80,60,pipe.bottom);
    });
    ctx.fillStyle="#ded895";
    ctx.fillRect(0,520,400,80);
    drawBird();
    if(!gameOver){
        ctx.fillStyle="#111";
        ctx.font="bold 50px Segoe UI";
        ctx.textAlign="center";
        ctx.fillText(score,200,100);
    }
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}
loop();

showSetup();
</script>

</body>
</html>
